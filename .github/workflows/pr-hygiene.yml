name: PR hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git diff --name-only "$base...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Add a line to the [Unreleased] section of CHANGELOG.md (or the no-changelog label if the change affects no one)."
            exit 1
          fi
          if ! git diff "$base...HEAD" -- CHANGELOG.md | grep -qE '^\+- '; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no new list item (a line starting with '- ')."
            exit 1
          fi

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has a subject ≤ 72 characters and a body describing the changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          export LC_ALL=C.UTF-8  # subject length in characters, not bytes (multibyte UTF-8)
          failed=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            subject="$(git log -1 --format=%s "$sha")"
            body="$(git log -1 --format=%b "$sha" | grep -vE '^(Co-Authored-By|Signed-off-by|Claude-Session):' | sed '/^\s*$/d')"
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::${sha:0:7} subject longer than 72 characters: $subject"
              failed=1
            fi
            if [ -z "$body" ]; then
              echo "::error::${sha:0:7} no body: describe what changed and why (see .gitmessage)"
              failed=1
            fi
          done
          exit $failed
