name: PR hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md оновлено
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git diff --name-only "$base...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Додай рядок у розділ [Unreleased] у CHANGELOG.md (або мітку no-changelog, якщо зміна нікого не стосується)."
            exit 1
          fi
          if ! git diff "$base...HEAD" -- CHANGELOG.md | grep -qE '^\+- '; then
            echo "::error file=CHANGELOG.md::У CHANGELOG.md немає нового пункту списку (рядок, що починається з '- ')."
            exit 1
          fi

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Кожен коміт має тему ≤ 72 символів і тіло з описом змін
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          export LC_ALL=C.UTF-8  # довжина теми в символах, а не байтах (кирилиця)
          failed=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            subject="$(git log -1 --format=%s "$sha")"
            body="$(git log -1 --format=%b "$sha" | grep -vE '^(Co-Authored-By|Signed-off-by|Claude-Session):' | sed '/^\s*$/d')"
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::${sha:0:7} тема довша за 72 символи: $subject"
              failed=1
            fi
            if [ -z "$body" ]; then
              echo "::error::${sha:0:7} без тіла: опиши, що змінилось і чому (див. .gitmessage)"
              failed=1
            fi
          done
          exit $failed
